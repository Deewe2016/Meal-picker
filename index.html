<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dinner Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>🍽️ What Are We Eating?</h1>
    <p class="subtitle">No more arguing. Let code decide.</p>

    <div class="result-box">
      <h2 id="winner">Press the button!</h2>
    </div>

    <button id="spinBtn" onclick="pickRestaurant()">Pick For Us!</button>

    <div class="input-container">
      <input type="text" id="restaurantInput" placeholder="Add a place (e.g., Tacos)...">
      <button onclick="addRestaurant()">Add</button>
    </div>

    <h3>Your Restaurant Pool:</h3>
    <ul id="restaurantList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
